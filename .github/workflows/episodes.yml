# Checks the podcast feed every 6 hours and publishes pages for new episodes.
# Run it by hand from the repo's Actions tab ("Update episodes" → Run workflow).
name: Update episodes

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-episodes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pillow

      - name: Build episode pages
        run: python scripts/build_episodes.py

      - name: Publish changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No new episodes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update episode pages from the podcast feed"
          git push
          # Make sure GitHub Pages rebuilds even though the push came from a bot
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
